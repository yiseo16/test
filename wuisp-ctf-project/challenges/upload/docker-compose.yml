# ⚠️ 이 파일은 4조가 통합 테스트를 위해 만든 더미입니다.
# 3조는 실제 챌린지가 완성되면 이 파일을 자기 것으로 완전히 교체하세요.
# (서비스명 upload-app, 포트 8083, container_name 미사용, networks 미정의 — 통합 계약서 규칙만 지키면 됩니다)

services:
  upload-app:
    image: nginx:alpine
    ports:
      - "8083:80"
    volumes:
      - ./dummy:/usr/share/nginx/html:ro
